name: Publish Docker Hub image

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: Docker Hub namespace or username
        required: true
        type: string
      tag:
        description: Image tag to publish
        required: true
        default: 0.1.1
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate publication inputs
        env:
          NAMESPACE: ${{ inputs.namespace }}
          TAG: ${{ inputs.tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$NAMESPACE" =~ ^[a-z0-9][a-z0-9._-]{2,254}$ ]]; then
            echo "namespace must be a lowercase Docker Hub namespace" >&2
            exit 1
          fi
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must use MAJOR.MINOR.PATCH format" >&2
            exit 1
          fi
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets first" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: |
            docker.io/${{ inputs.namespace }}/poketokendocker:${{ inputs.tag }}
            docker.io/${{ inputs.namespace }}/poketokendocker:latest
          build-args: |
            VERSION=${{ inputs.tag }}
